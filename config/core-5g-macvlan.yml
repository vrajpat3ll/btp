apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: core5g-def
  namespace: loadbalancer
spec:
  config: '{
            "cniVersion": "0.3.1",
            "plugins": [
                {
                    "type": "macvlan",
                    "capabilities": { "ips": true },
                    "master": "eth1",
                    "mode": "bridge",
                    "ipam": {
                        "type": "static",
                        "addresses": [
                          {
                            "address": "10.0.3.1/24",
                            "gateway": "10.0.3.254"
                          }
                        ]
                    }
                }, {
                    "type": "tuning"
                } ]
        }'
